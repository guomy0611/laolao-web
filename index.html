<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="任务助手">
  <title>任务助手</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --primary: #63ebe9;
      --primary-dark: #3dd4d2;
      --primary-light: #e8fafa;
      --text: #1a1a2e;
      --text-sec: #8e9bb0;
      --bg: #f4fafa;
      --surface: #fff;
      --border: #e2f0f0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* ─── Header ─── */
    .header {
      background: var(--surface);
      padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-dot { width: 30px; height: 30px; background: var(--primary); border-radius: 8px; }
    .logo-text h1 { font-size: 14px; font-weight: 700; }
    .logo-text p { font-size: 10px; color: var(--text-sec); }
    .badge { padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .badge-idle { background: var(--primary-light); color: var(--primary-dark); }
    .badge-running { background: var(--primary); color: white; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.7} }

    /* ─── Gate ─── */
    #gate {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; align-items: center; justify-content: center; z-index: 999;
    }
    .gate-box {
      background: var(--surface); border-radius: 16px;
      padding: 32px 28px; width: 300px;
      box-shadow: 0 8px 32px rgba(0,0,0,.08); text-align: center;
    }
    .gate-dot { width: 48px; height: 48px; background: var(--primary); border-radius: 14px; margin: 0 auto 16px; }
    .gate-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .gate-sub { font-size: 13px; color: var(--text-sec); margin-bottom: 20px; }
    .gate-input {
      width: 100%; height: 46px; border: 1.5px solid var(--border);
      border-radius: 10px; padding: 0 14px; font-size: 16px; text-align: center;
      letter-spacing: 2px; outline: none; margin-bottom: 12px;
    }
    .gate-input:focus { border-color: var(--primary); }
    .gate-btn {
      width: 100%; height: 46px; background: var(--primary); color: white;
      border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .gate-error { font-size: 12px; color: #f87171; margin-top: 8px; }

    /* ─── Platform select ─── */
    #platformSelect {
      position: fixed; inset: 0; background: var(--bg);
      display: none; align-items: center; justify-content: center; z-index: 99;
    }
    .platform-box {
      background: var(--surface); border-radius: 20px;
      padding: 32px 24px; width: 300px;
      box-shadow: 0 8px 32px rgba(0,0,0,.08); text-align: center;
    }
    .platform-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .platform-sub { font-size: 13px; color: var(--text-sec); margin-bottom: 24px; }
    .platform-cards { display: flex; flex-direction: column; gap: 12px; }
    .platform-card {
      padding: 16px; border: 2px solid var(--border);
      border-radius: 12px; cursor: pointer;
      transition: border-color .15s, background .15s;
      text-align: left; display: flex; align-items: center; gap: 12px;
    }
    .platform-card:hover, .platform-card:active { background: var(--primary-light); border-color: var(--primary); }
    .platform-icon {
      width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 800; color: white; flex-shrink: 0;
    }
    .platform-icon.laolao { background: var(--primary); }
    .platform-icon.xft { background: #6366f1; }
    .platform-info h3 { font-size: 14px; font-weight: 700; }
    .platform-info p { font-size: 12px; color: var(--text-sec); margin-top: 2px; }

    /* ─── Main ─── */
    .container { max-width: 480px; margin: 0 auto; }
    .card { background: var(--surface); padding: 12px 16px; margin-bottom: 0; }
    .divider { height: 6px; background: var(--bg); }
    .divider-line { height: 1px; background: var(--border); margin: 8px 0; }
    .card-title {
      font-size: 11px; font-weight: 700; color: var(--text-sec);
      text-transform: uppercase; letter-spacing: 0.5px;
      display: block; margin-bottom: 10px;
    }

    /* ─── Status ─── */
    .status-card {
      background: var(--surface); padding: 10px 16px;
      display: flex; align-items: center; gap: 10px;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #dde3ec; flex-shrink: 0; }
    .status-dot.ok { background: var(--primary); }
    .status-dot.fail { background: #f87171; }
    .status-text { font-size: 13px; color: var(--text-sec); flex: 1; }
    .btn-text { background: none; border: none; color: var(--primary-dark); font-size: 13px; font-weight: 600; cursor: pointer; padding: 0; }

    /* ─── Platform tag ─── */
    .platform-tag {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 700; cursor: pointer;
    }
    .platform-tag.laolao { background: var(--primary-light); color: var(--primary-dark); }
    .platform-tag.xft { background: #ede9fe; color: #5b21b6; }

    /* ─── Login modal ─── */
    #loginModal {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.4); z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-box { background: white; border-radius: 16px; padding: 24px 20px; width: 300px; margin: 0 16px; }
    .modal-title { font-size: 15px; font-weight: 700; margin-bottom: 16px; }

    /* ─── Form ─── */
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; color: var(--text-sec); margin-bottom: 6px; }
    .field input {
      width: 100%; height: 44px; border: 1.5px solid var(--border);
      border-radius: 10px; padding: 0 14px; font-size: 15px; outline: none; background: #fafffe;
      transition: border-color .2s;
    }
    .field input:focus { border-color: var(--primary); }

    /* ─── Config ─── */
    .config-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    .config-row:last-child { border-bottom: none; }
    .config-label { font-size: 14px; color: var(--text); }
    .config-right { display: flex; align-items: center; gap: 8px; }
    .num-input {
      width: 56px; height: 34px; border: 1.5px solid var(--border);
      border-radius: 8px; text-align: center; font-size: 14px; color: var(--text); outline: none;
    }
    .num-input:focus { border-color: var(--primary); }
    .unit { font-size: 12px; color: var(--text-sec); white-space: nowrap; }

    /* ─── Toggle ─── */
    .toggle { position: relative; display: inline-block; width: 44px; height: 24px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; cursor: pointer; inset: 0;
      background: #dde3ec; border-radius: 24px; transition: .25s;
    }
    .toggle-slider::before {
      content: ''; position: absolute;
      width: 18px; height: 18px; left: 3px; top: 3px;
      background: white; border-radius: 50%; transition: .25s;
      box-shadow: 0 1px 4px rgba(0,0,0,.15);
    }
    .toggle input:checked + .toggle-slider { background: var(--primary); }
    .toggle input:checked + .toggle-slider::before { transform: translateX(20px); }

    /* ─── Groups ─── */
    .group-list { display: flex; flex-direction: column; gap: 6px; }
    .group-loading { font-size: 12px; color: var(--text-sec); padding: 4px 0; text-align: center; }
    .group-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border: 1.5px solid var(--border);
      border-radius: 8px; cursor: pointer;
      transition: border-color .15s, background .15s; user-select: none;
    }
    .group-item:active { background: var(--primary-light); }
    .group-item.selected { background: var(--primary-light); border-color: var(--primary); }
    .group-check {
      width: 18px; height: 18px; border-radius: 4px;
      border: 1.5px solid #cbd5e1;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 10px; color: white; transition: all .15s;
    }
    .group-item.selected .group-check { background: var(--primary); border-color: var(--primary); }
    .group-item.selected .group-check::after { content: '✓'; }
    .group-name { font-size: 13px; color: var(--text); flex: 1; }
    .group-count { font-size: 11px; color: var(--text-sec); }

    /* ─── Exec ─── */
    .exec-row {
      display: flex; align-items: center;
      justify-content: space-between; gap: 8px; padding: 8px 0;
    }
    .exec-info { display: flex; align-items: center; gap: 6px; }
    .exec-label { font-size: 13px; font-weight: 600; color: var(--text); }
    .exec-controls { display: flex; align-items: center; gap: 6px; }
    .btn-exec {
      height: 32px; padding: 0 16px; border: none; border-radius: 8px;
      font-size: 12px; font-weight: 600; cursor: pointer;
      transition: background .15s, transform .1s; white-space: nowrap; flex-shrink: 0;
    }
    .btn-exec:active:not(:disabled) { transform: scale(.96); }
    .btn-exec:disabled { opacity: .4; cursor: not-allowed; }
    .btn-exec-primary { background: var(--primary); color: white; }
    .btn-exec-primary:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-exec-primary.running { background: var(--primary-light); color: var(--primary-dark); }
    .btn-exec-ghost { background: #f1f5f9; color: var(--text-sec); }
    .btn-exec-ghost:hover:not(:disabled) { background: #e2e8f0; color: var(--text); }

    /* ─── Buttons ─── */
    .btn-row { display: flex; gap: 8px; }
    .btn-outline {
      flex: 1; height: 32px; background: none;
      border: 1.5px solid var(--primary); border-radius: 8px;
      color: var(--primary-dark); font-size: 12px; font-weight: 600;
      cursor: pointer; transition: background .15s;
    }
    .btn-outline:hover { background: var(--primary-light); }
    .btn-modal-row { display: flex; gap: 10px; }
    .btn { height: 44px; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; transition: background .15s; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-ghost-btn { background: #f1f5f9; color: var(--text-sec); }

    /* ─── Log ─── */
    .log-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .log-container {
      background: #f8fafc; border: 1px solid var(--border);
      border-radius: 8px; padding: 8px;
      max-height: 200px; overflow-y: auto;
      font-family: 'SF Mono', Consolas, monospace; font-size: 11px;
    }
    .log-empty { color: #b0b8c8; text-align: center; padding: 16px 0; }
    .log-line { display: flex; gap: 6px; padding: 2px 0; border-bottom: 1px solid #eef2f7; line-height: 1.6; }
    .log-line:last-child { border-bottom: none; }
    .log-time { color: #b0b8c8; flex-shrink: 0; }
    .log-msg { flex: 1; }
    .log-info { color: #0891b2; }
    .log-success { color: #0d9488; }
    .log-warn { color: #0e7490; }
    .log-error { color: #ef4444; }

    /* ─── Footer ─── */
    .footer {
      background: var(--surface); border-top: 1px solid var(--border);
      padding: 8px 16px; display: flex; align-items: center;
      justify-content: space-between; font-size: 11px; color: var(--text-sec);
    }
    .toggle-inline { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 11px; color: var(--text-sec); }
    .toggle-sm { width: 30px; height: 17px; }
    .toggle-sm .toggle-slider::before { width: 11px; height: 11px; }
    .toggle-sm input:checked + .toggle-slider::before { transform: translateX(13px); }

    /* ─── Tooltip ─── */
    .action-tip {
      width: 15px; height: 15px; border-radius: 50%;
      background: var(--primary-light); color: var(--primary-dark);
      font-size: 10px; font-weight: 700;
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
    }
    .action-tip:hover { background: var(--primary); color: white; }
    .tooltip {
      display: none; position: fixed; max-width: 200px;
      background: #1e293b; color: #e2e8f0; font-size: 11px; line-height: 1.5;
      padding: 7px 10px; border-radius: 8px; z-index: 1000;
      pointer-events: none; box-shadow: 0 4px 12px rgba(0,0,0,.2);
    }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  </style>
</head>
<body>

  <!-- 访问密码 -->
  <div id="gate">
    <div class="gate-box">
      <div class="gate-dot"></div>
      <div class="gate-title">任务助手</div>
      <div class="gate-sub">请输入访问密码</div>
      <input type="password" id="gateInput" class="gate-input" placeholder="••••••••" maxlength="20">
      <button class="gate-btn" id="gateBtn">进入</button>
      <div class="gate-error" id="gateError"></div>
    </div>
  </div>

  <!-- 平台选择 -->
  <div id="platformSelect">
    <div class="platform-box">
      <div class="gate-dot" style="background: var(--primary)"></div>
      <div class="platform-title">选择平台</div>
      <div class="platform-sub">请选择你要使用的任务平台</div>
      <div class="platform-cards">
        <div class="platform-card" id="selectLaolao">
          <div class="platform-icon laolao">捞</div>
          <div class="platform-info">
            <h3>捞捞</h3>
            <p>makemoneygogogo.com</p>
          </div>
        </div>
        <div class="platform-card" id="selectXft">
          <div class="platform-icon xft">星</div>
          <div class="platform-info">
            <h3>星粉通</h3>
            <p>ddlink.vip</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 登录弹窗 -->
  <div id="loginModal">
    <div class="modal-box">
      <div class="modal-title" id="loginModalTitle">账号设置</div>
      <div class="field">
        <label>手机号 / 邮箱</label>
        <input type="text" id="username" placeholder="请输入账号" autocomplete="username">
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
      </div>
      <div class="btn-modal-row">
        <button class="btn btn-ghost-btn" id="btnCancelLogin" style="flex:1;">取消</button>
        <button class="btn btn-primary" id="btnLogin" style="flex:2;">验证登录</button>
      </div>
    </div>
  </div>

  <div class="header">
    <div class="logo">
      <div class="logo-dot"></div>
      <div class="logo-text">
        <h1>任务助手</h1>
        <p id="platformSubtitle">自动任务执行器</p>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <span id="platformTag" class="platform-tag laolao" style="display:none;">捞捞</span>
      <span id="badge" class="badge badge-idle">待机</span>
    </div>
  </div>

  <div class="container">

    <div class="status-card">
      <div id="statusDot" class="status-dot"></div>
      <span id="statusText" class="status-text">请先登录</span>
      <button class="btn-text" id="btnShowLogin" style="display:none;">修改</button>
    </div>

    <div class="divider"></div>

    <!-- 打开/刷新 -->
    <div class="card">
      <div class="btn-row">
        <button id="openSite" class="btn-outline">打开网页</button>
        <button id="refreshSite" class="btn-outline">刷新网页</button>
      </div>
    </div>

    <div class="divider"></div>

    <!-- 配置 -->
    <div class="card">
      <div class="section-header">
        <span class="card-title" style="margin:0">执行分组</span>
        <button class="btn-text" id="btnRefreshGroups">刷新</button>
      </div>
      <div id="groupList" class="group-list">
        <div class="group-loading">请先登录</div>
      </div>
    </div>

    <div class="card" style="margin-top:0">
      <div class="config-row" id="signInRow" style="display:none;">
        <span class="config-label">签到自动验证</span>
        <label class="toggle">
          <input type="checkbox" id="signInAutoVerify">
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="config-row">
        <span class="config-label">领取范围</span>
        <div class="config-right">
          <input type="number" id="taskDays" class="num-input" value="3" min="1" max="30">
          <span class="unit">天内</span>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- 执行方式 -->
    <div class="card">
      <div class="card-title">执行方式</div>
      <div class="exec-row">
        <div class="exec-info">
          <span class="exec-label">执行一次</span>
          <span class="action-tip" data-tip="立即领取并执行指定天数内的未执行任务，完成后自动停止">?</span>
        </div>
        <button id="btnStart" class="btn-exec btn-exec-primary">开始</button>
      </div>
      <div class="divider-line"></div>
      <div class="exec-row">
        <div class="exec-info">
          <span class="exec-label">定期执行</span>
          <span class="action-tip" data-tip="每隔设定时间自动执行一次，只要浏览器开着就持续运行。每10天登录状态失效，建议定期检查">?</span>
        </div>
        <div class="exec-controls">
          <input type="number" id="intervalMinutes" class="num-input" value="5" min="1" max="120" style="width:46px;">
          <span class="unit">分钟</span>
          <button id="btnSchedule" class="btn-exec btn-exec-primary">开始</button>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="card">
      <div class="log-header">
        <span class="card-title" style="margin:0">执行日志</span>
        <button class="btn-text" id="btnClearLog">清空</button>
      </div>
      <div id="logContainer" class="log-container">
        <div class="log-empty">暂无日志</div>
      </div>
    </div>

    <div class="footer">
      <span id="footerPlatform">任务助手</span>
      <label class="toggle-inline">
        <span>悬浮球</span>
        <label class="toggle toggle-sm">
          <input type="checkbox" id="floatingBallToggle">
          <span class="toggle-slider"></span>
        </label>
      </label>
    </div>

    <div id="tooltip" class="tooltip"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
