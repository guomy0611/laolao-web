<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="任务助手">
  <title>任务助手</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #63ebe9;
      --primary-dark: #3dd4d2;
      --primary-light: #e8fafa;
      --text: #1a1a2e;
      --text-sec: #8e9bb0;
      --bg: #f4fafa;
      --surface: #fff;
      --border: #e2f0f0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    #gate {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; align-items: center; justify-content: center; z-index: 99;
    }
    .box {
      background: var(--surface); border-radius: 20px;
      padding: 36px 28px; width: 300px;
      box-shadow: 0 8px 32px rgba(0,0,0,.08); text-align: center;
    }
    .dot { width: 48px; height: 48px; background: var(--primary); border-radius: 14px; margin: 0 auto 16px; }
    .title { font-size: 20px; font-weight: 700; margin-bottom: 6px; color: var(--text); }
    .sub { font-size: 13px; color: var(--text-sec); margin-bottom: 24px; }
    .gate-input {
      width: 100%; height: 46px; border: 1.5px solid var(--border);
      border-radius: 10px; padding: 0 14px; font-size: 16px; text-align: center;
      letter-spacing: 2px; outline: none; margin-bottom: 12px;
    }
    .gate-input:focus { border-color: var(--primary); }
    .gate-btn {
      width: 100%; height: 46px; background: var(--primary); color: white;
      border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .gate-error { font-size: 12px; color: #f87171; margin-top: 8px; min-height: 18px; }

    .platform-cards { display: flex; flex-direction: column; gap: 12px; }
    .platform-card {
      padding: 16px; border: 2px solid var(--border);
      border-radius: 12px; cursor: pointer;
      transition: border-color .15s, background .15s;
      display: flex; align-items: center; gap: 14px; text-decoration: none;
    }
    .platform-card:hover { background: var(--primary-light); border-color: var(--primary); }
    .platform-icon {
      width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 800; color: white; flex-shrink: 0;
    }
    .icon-laolao { background: var(--primary); }
    .icon-xft { background: #6366f1; }
    .platform-info h3 { font-size: 15px; font-weight: 700; color: var(--text); }
    .platform-info p { font-size: 12px; color: var(--text-sec); margin-top: 2px; }

    #main { display: none; }
  </style>
</head>
<body>
  <div id="gate">
    <div class="box">
      <div class="dot"></div>
      <div class="title">任务助手</div>
      <div class="sub">请输入访问密码</div>
      <input type="password" id="gateInput" class="gate-input" placeholder="••••••••" maxlength="20">
      <button class="gate-btn" id="gateBtn">进入</button>
      <div class="gate-error" id="gateError"></div>
    </div>
  </div>

  <div id="main">
    <div class="box">
      <div class="dot"></div>
      <div class="title">选择平台</div>
      <div class="sub">请选择你要使用的任务平台</div>
      <div class="platform-cards">
        <a class="platform-card" href="laolao.html">
          <div class="platform-icon icon-laolao">捞</div>
          <div class="platform-info">
            <h3>捞捞</h3>
            <p>微博任务自动化</p>
          </div>
        </a>
        <a class="platform-card" href="xft.html">
          <div class="platform-icon icon-xft">星</div>
          <div class="platform-info">
            <h3>星粉通</h3>
            <p>微博任务自动化</p>
          </div>
        </a>
      </div>
    </div>
  </div>

  <script>
    const GATE_KEY = 'liuyuxinnb';
    const gate = document.getElementById('gate');
    const main = document.getElementById('main');
    const input = document.getElementById('gateInput');
    const btn = document.getElementById('gateBtn');
    const err = document.getElementById('gateError');

    if (sessionStorage.getItem('gate_ok') === '1') {
      gate.style.display = 'none';
      main.style.display = 'block';
    }

    function tryEnter() {
      if (input.value === GATE_KEY) {
        sessionStorage.setItem('gate_ok', '1');
        gate.style.display = 'none';
        main.style.display = 'block';
      } else {
        err.textContent = '密码错误，请重试';
        input.value = ''; input.focus();
      }
    }
    btn.addEventListener('click', tryEnter);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') tryEnter(); });
    input.focus();
  </script>
</body>
</html>
