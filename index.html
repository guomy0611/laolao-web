<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="捞捞助手">
  <title>捞捞助手</title>
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --primary: #63ebe9;
      --primary-dark: #3dd4d2;
      --primary-light: #e8fafa;
      --text: #1a1a2e;
      --text-sec: #8e9bb0;
      --bg: #f4fafa;
      --surface: #fff;
      --border: #e2f0f0;
      --success: #0d9488;
      --error: #6366f1;
      --warn: #0e7490;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .header {
      background: var(--surface);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-dot {
      width: 32px; height: 32px;
      background: var(--primary);
      border-radius: 9px;
    }
    .logo-text h1 { font-size: 16px; font-weight: 700; }
    .logo-text p { font-size: 11px; color: var(--text-sec); }

    .badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px; font-weight: 600;
    }
    .badge-idle { background: var(--primary-light); color: var(--primary-dark); }
    .badge-running { background: var(--primary); color: white; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.7} }

    .container { max-width: 480px; margin: 0 auto; padding: 0; }

    .card {
      background: var(--surface);
      margin: 8px 0;
      padding: 16px 20px;
    }
    .card-title {
      font-size: 11px; font-weight: 700;
      color: var(--text-sec);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    /* Login */
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; color: var(--text-sec); margin-bottom: 6px; }
    .field input {
      width: 100%; height: 44px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 0 14px;
      font-size: 15px;
      outline: none;
      background: #fafffe;
      transition: border-color .2s;
    }
    .field input:focus { border-color: var(--primary); }

    /* Config rows */
    .config-row {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .config-row:last-child { border-bottom: none; }
    .config-label { font-size: 14px; color: var(--text); }
    .config-right { display: flex; align-items: center; gap: 8px; }

    .num-input {
      width: 60px; height: 34px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      text-align: center;
      font-size: 14px; color: var(--text);
      outline: none;
    }
    .num-input:focus { border-color: var(--primary); }
    .unit { font-size: 13px; color: var(--text-sec); }

    /* Toggle */
    .toggle { position: relative; display: inline-block; width: 44px; height: 24px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; cursor: pointer; inset: 0;
      background: #dde3ec; border-radius: 24px; transition: .25s;
    }
    .toggle-slider::before {
      content: ''; position: absolute;
      width: 18px; height: 18px;
      left: 3px; top: 3px;
      background: white; border-radius: 50%;
      transition: .25s;
      box-shadow: 0 1px 4px rgba(0,0,0,.15);
    }
    .toggle input:checked + .toggle-slider { background: var(--primary); }
    .toggle input:checked + .toggle-slider::before { transform: translateX(20px); }

    /* Groups */
    .group-list { display: flex; flex-direction: column; gap: 8px; }
    .group-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      user-select: none;
    }
    .group-item:active { background: var(--primary-light); }
    .group-item.selected { background: var(--primary-light); border-color: var(--primary); }
    .group-check {
      width: 20px; height: 20px;
      border-radius: 5px;
      border: 1.5px solid #cbd5e1;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 12px; color: white;
      transition: all .15s;
    }
    .group-item.selected .group-check { background: var(--primary); border-color: var(--primary); }
    .group-item.selected .group-check::after { content: '✓'; }
    .group-name { font-size: 14px; color: var(--text); flex: 1; }
    .group-count { font-size: 12px; color: var(--text-sec); }
    .group-loading { font-size: 13px; color: var(--text-sec); padding: 8px 0; text-align: center; }

    /* Buttons */
    .btn {
      width: 100%; height: 50px;
      border: none; border-radius: 12px;
      font-size: 16px; font-weight: 700;
      cursor: pointer;
      transition: background .15s, transform .1s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:active:not(:disabled) { transform: scale(.97); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:active:not(:disabled) { background: var(--primary-dark); }
    .btn-primary.running { background: var(--primary-light); color: var(--primary-dark); }
    .btn-ghost { background: #f1f5f9; color: var(--text-sec); }
    .btn-row { display: flex; gap: 10px; }
    .btn-row .btn { flex: 1; height: 44px; font-size: 14px; }

    /* Log */
    .log-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .log-container {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      max-height: 240px;
      overflow-y: auto;
      font-family: 'SF Mono', Consolas, monospace;
      font-size: 12px;
    }
    .log-empty { color: #b0b8c8; text-align: center; padding: 20px 0; }
    .log-line { display: flex; gap: 8px; padding: 3px 0; border-bottom: 1px solid #eef2f7; line-height: 1.6; }
    .log-line:last-child { border-bottom: none; }
    .log-time { color: #b0b8c8; flex-shrink: 0; font-size: 11px; padding-top: 1px; }
    .log-msg { flex: 1; }
    .log-info { color: #0891b2; }
    .log-success { color: #0d9488; }
    .log-warn { color: #0e7490; }
    .log-error { color: #ef4444; }

    .divider { height: 8px; background: var(--bg); }

    /* Gate */
    #gate {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 999;
    }
    .gate-box {
      background: var(--surface);
      border-radius: 16px;
      padding: 32px 28px;
      width: 300px;
      box-shadow: 0 8px 32px rgba(0,0,0,.08);
      text-align: center;
    }
    .gate-dot {
      width: 48px; height: 48px;
      background: var(--primary);
      border-radius: 14px;
      margin: 0 auto 16px;
    }
    .gate-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .gate-sub { font-size: 13px; color: var(--text-sec); margin-bottom: 20px; }
    .gate-input {
      width: 100%; height: 46px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 0 14px;
      font-size: 16px; text-align: center;
      letter-spacing: 2px;
      outline: none; margin-bottom: 12px;
    }
    .gate-input:focus { border-color: var(--primary); }
    .gate-btn {
      width: 100%; height: 46px;
      background: var(--primary); color: white;
      border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700;
      cursor: pointer;
    }
    .gate-btn:active { background: var(--primary-dark); }
    .gate-error { font-size: 12px; color: #f87171; margin-top: 8px; }

    /* Status bar */
    .status-card {
      background: var(--surface);
      padding: 12px 20px;
      display: flex; align-items: center; gap: 10px;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #dde3ec;
      flex-shrink: 0;
    }
    .status-dot.ok { background: var(--primary); }
    .status-dot.fail { background: #f87171; }
    .status-text { font-size: 13px; color: var(--text-sec); flex: 1; }
    .btn-text { background: none; border: none; color: var(--primary-dark); font-size: 13px; font-weight: 600; cursor: pointer; padding: 0; }

    /* Section label */
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }

    /* Schedule interval */
    .schedule-row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  </style>
</head>
<body>
  <!-- 访问密码 -->
  <div id="gate">
    <div class="gate-box">
      <div class="gate-dot"></div>
      <div class="gate-title">捞捞助手</div>
      <div class="gate-sub">请输入访问密码</div>
      <input type="password" id="gateInput" class="gate-input" placeholder="••••••••" maxlength="20">
      <button class="gate-btn" id="gateBtn">进入</button>
      <div class="gate-error" id="gateError"></div>
    </div>
  </div>

  <div class="header">
    <div class="logo">
      <div class="logo-dot"></div>
      <div class="logo-text">
        <h1>捞捞助手</h1>
        <p>自动任务执行器</p>
      </div>
    </div>
    <span id="badge" class="badge badge-idle">待机</span>
  </div>

  <div class="container">

    <!-- 登录状态 -->
    <div class="status-card">
      <div id="statusDot" class="status-dot"></div>
      <span id="statusText" class="status-text">请填写账号信息</span>
      <button class="btn-text" id="btnShowLogin">修改</button>
    </div>

    <div class="divider"></div>

    <!-- 账号弹窗 -->
    <div id="loginModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:100; display:none; align-items:center; justify-content:center;">
      <div style="background:white; border-radius:16px; padding:24px 20px; width:300px; margin:0 16px;">
        <div style="font-size:15px; font-weight:700; margin-bottom:16px;">账号设置</div>
        <div class="field">
          <label>手机号 / 邮箱</label>
          <input type="text" id="username" placeholder="请输入账号" autocomplete="username">
        </div>
        <div class="field">
          <label>密码</label>
          <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
        </div>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-ghost" id="btnCancelLogin" style="height:44px;font-size:14px;flex:1;">取消</button>
          <button class="btn btn-primary" id="btnLogin" style="height:44px;font-size:14px;flex:2;">验证登录</button>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- 执行配置 -->
    <div class="card">
      <div class="section-header">
        <span class="card-title" style="margin:0">执行分组</span>
        <button class="btn-text" id="btnRefreshGroups">刷新</button>
      </div>
      <div id="groupList" class="group-list">
        <div class="group-loading">请先验证登录</div>
      </div>
    </div>

    <div class="card" style="margin-top:0">
      <div class="config-row">
        <span class="config-label">签到自动验证</span>
        <label class="toggle">
          <input type="checkbox" id="signInAutoVerify">
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="config-row">
        <span class="config-label">领取范围</span>
        <div class="config-right">
          <input type="number" id="taskDays" class="num-input" value="3" min="1" max="30">
          <span class="unit">天内</span>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- 执行方式 -->
    <div class="card">
      <div class="card-title">执行方式</div>

      <div class="config-row">
        <span class="config-label">执行一次</span>
        <button id="btnStart" class="btn btn-primary" style="width:80px;height:36px;font-size:13px;border-radius:8px;">开始</button>
      </div>

      <div class="config-row" style="flex-direction:column;align-items:stretch;gap:10px;">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span class="config-label">定期执行</span>
          <button id="btnSchedule" class="btn btn-primary" style="width:80px;height:36px;font-size:13px;border-radius:8px;">开始</button>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="unit">每隔</span>
          <input type="number" id="intervalMinutes" class="num-input" value="5" min="1" max="120">
          <span class="unit">分钟执行一次</span>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- 日志 -->
    <div class="card">
      <div class="log-header">
        <span class="card-title" style="margin:0">执行日志</span>
        <button class="btn-text" id="btnClearLog">清空</button>
      </div>
      <div id="logContainer" class="log-container">
        <div class="log-empty">暂无日志</div>
      </div>
    </div>

    <div style="height:20px;"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
